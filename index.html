<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-Resize Textarea Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      .auto-resize-textarea {
        min-height: 38px;
        transition: height 0.2s ease;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen p-8">
    <div
      id="root"
      class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md"
    ></div>

    <script type="text/babel">
      // Simple textarea component with auto-resize functionality
      const AutoResizeTextarea = React.forwardRef(
        ({ allowMultipleRows = false, ...props }, ref) => {
          const [rows, setRows] = React.useState(1);
          const textareaRef = React.useRef(null);

          // Combine refs
          const setRefs = (element) => {
            textareaRef.current = element;
            if (ref) {
              if (typeof ref === "function") {
                ref(element);
              } else {
                ref.current = element;
              }
            }
          };

          // Function to calculate and set rows based on content
          const updateRows = (value) => {
            if (!textareaRef.current || !value) {
              setRows(1);
              return;
            }

            // Count newlines in the text
            const lineCount = (value.match(/\n/g) || []).length + 1;

            // If allowMultipleRows is false, always keep it at 1 row
            if (!allowMultipleRows) {
              setRows(1);
            } else {
              // Otherwise, set rows based on content (with a minimum of 1)
              setRows(Math.max(1, lineCount));
            }
          };

          // Update rows when value changes
          React.useEffect(() => {
            updateRows(props.value);
          }, [props.value]);

          // Handle value change
          const handleChange = (e) => {
            const value = e.target.value;
            updateRows(value);
            if (props.onChange) {
              props.onChange(e);
            }
          };

          return (
            <textarea
              {...props}
              ref={setRefs}
              rows={rows}
              onChange={handleChange}
              className={`auto-resize-textarea ${props.className || ""}`}
              style={{
                resize: allowMultipleRows ? "vertical" : "none",
                overflow: allowMultipleRows ? "auto" : "hidden",
                ...props.style,
              }}
            />
          );
        }
      );

      // Demo App
      function App() {
        const [value1, setValue1] = React.useState("");
        const [value2, setValue2] = React.useState("");

        return (
          <div>
            <h1 className="text-2xl font-bold mb-6">
              Auto-Resize Textarea Demo
            </h1>

            <div className="mb-6">
              <h2 className="text-lg font-semibold mb-2">
                Single Row Textarea (allowMultipleRows=false)
              </h2>
              <p className="text-gray-600 mb-2">
                This textarea will always remain a single row, regardless of
                content.
              </p>
              <AutoResizeTextarea
                value={value1}
                onChange={(e) => setValue1(e.target.value)}
                placeholder="Type something... (will stay as one row)"
                className="border border-gray-300 rounded p-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                allowMultipleRows={false}
              />
            </div>

            <div className="mb-6">
              <h2 className="text-lg font-semibold mb-2">
                Multi-row Textarea (allowMultipleRows=true)
              </h2>
              <p className="text-gray-600 mb-2">
                This textarea will grow with content as you type.
              </p>
              <AutoResizeTextarea
                value={value2}
                onChange={(e) => setValue2(e.target.value)}
                placeholder="Type something... (will grow with content)"
                className="border border-gray-300 rounded p-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                allowMultipleRows={true}
              />
            </div>

            <div className="mt-8 p-4 bg-gray-100 rounded">
              <h3 className="font-semibold mb-2">Current Values:</h3>
              <div className="mb-2">
                <strong>Single Row:</strong>{" "}
                <span className="font-mono">{value1}</span>
              </div>
              <div>
                <strong>Multi Row:</strong>{" "}
                <pre className="font-mono bg-gray-200 p-2 rounded mt-1">
                  {value2}
                </pre>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
